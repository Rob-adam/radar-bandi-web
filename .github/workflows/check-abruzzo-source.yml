name: Check Abruzzo source HTTPS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-abruzzo-source.yml'
      - 'scripts/source_tls.py'
      - 'scripts/certificates/**'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP dependencies
        run: pip install requests beautifulsoup4
      - name: Test TLS scope and issuer trust
        run: python -m unittest discover -s tests -p test_pipeline.py
      - name: Fetch and parse Abruzzo with verified HTTPS
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from source_tls import source_tls_options
          from update_bandi import generic_region_items, HEADERS
          url="https://www.regione.abruzzo.it/contenuti/bandi"
          r=requests.get(url,headers=HEADERS,timeout=30,**source_tls_options(url))
          r.raise_for_status()
          title=BeautifulSoup(r.text,"html.parser").find("h1")
          assert title and title.get_text(strip=True)=="Bandi", "Unexpected listing page"
          records=generic_region_items(r.text,url,"Regione Abruzzo · Bandi","abruzzo")
          print("Verified Abruzzo listing:",r.status_code,"bytes:",len(r.content),"discovered candidates:",len(records))
          PY
