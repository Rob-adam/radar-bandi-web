name: Stripe sandbox checks
on:
  pull_request:
    paths:
      - 'src/stripe-*.js'
      - 'tests/stripe-*.test.mjs'
      - 'integration/site/stripe-checkout-existing-sheet-test.js'
      - '.github/workflows/stripe-sandbox-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Stripe verification and licence preparation
        run: node --test tests/stripe-*.test.mjs
