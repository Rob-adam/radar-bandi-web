name: Aggiorna catalogo BANDOVERA

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_bandi.py'
      - 'scripts/reconcile_bandi.py'
      - 'scripts/triage_bandi.py'
      - '.github/workflows/update-bandi.yml'

permissions:
  contents: write

jobs:
  aggiorna-bandi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dipendenze
        run: pip install requests beautifulsoup4

      - name: Cerca nuovi bandi
        run: python scripts/update_bandi.py

      - name: Confronta con lo storico
        run: python scripts/reconcile_bandi.py

      - name: Filtra prima dell AI
        run: python scripts/triage_bandi.py

      - name: Pubblica catalogo memoria e coda AI se cambiati
        run: |
          git config user.name "BANDOVERA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/radar_bandi_auto.json data/radar_bandi_state.json data/radar_bandi_ai_queue.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica significativa al catalogo automatico"
          else
            git commit -m "Aggiornamento incrementale bandi"
            git push
          fi
