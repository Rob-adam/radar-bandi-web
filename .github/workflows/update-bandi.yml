name: Aggiorna catalogo BANDOVERA

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna-bandi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dipendenze
        run: pip install requests beautifulsoup4

      - name: Cerca nuovi bandi
        run: python scripts/update_bandi.py

      - name: Pubblica catalogo se cambiato
        run: |
          git config user.name "BANDOVERA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/radar_bandi_auto.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica al catalogo automatico"
          else
            git commit -m "Aggiornamento automatico bandi"
            git push
          fi
