name: Deploy BANDOVERA to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collaudo dashboard e licenze
        run: node --test tests/*.test.mjs

      - name: Proteggi accesso privato RB-0003
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/migrate-client-access.mjs


      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.149.0'
          command: deploy --config wrangler.jsonc


      - name: Consegna link cifrato
        uses: actions/upload-artifact@v4
        with:
          name: RB-0003-private-delivery
          path: private-delivery/RB-0003-link.enc
          retention-days: 1
