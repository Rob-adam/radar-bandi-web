<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BANDOVERA · Esito richiesta</title><style>body{background:#071321;color:#f2f8fc;font-family:Calibri,Arial,sans-serif;padding:25px}.box{max-width:620px;margin:12vh auto;padding:28px;background:#0c1c2c;border:1px solid #2a4a61;border-radius:18px}a{color:#35d1c5}</style></head><body><main class="box"><h1 id="title">Richiesta Bandovera</h1><p id="message">Stiamo verificando lo stato del pagamento. Riceverai comunicazione dopo la conferma ufficiale.</p><p><a href="https://bandovera.it/attiva.html">Torna alla richiesta</a></p></main><script>if(new URLSearchParams(location.search).get('status')==='success'){const site=new URLSearchParams(location.search).get('site');location.replace((site==='https://www.bandovera.it'?site:'https://bandovera.it')+'/attiva.html?pagamento=verifica')}if(new URLSearchParams(location.search).get('status')==='cancel'){document.getElementById('title').textContent='Pagamento annullato';document.getElementById('message').textContent='Non abbiamo attivato alcuna licenza. Puoi riprovare quando desideri.'}else{document.getElementById('title').textContent='Verifica del pagamento';document.getElementById('message').textContent='Stiamo attendendo la conferma verificata di Stripe. Dopo la verifica riceverai via email il collegamento personale alla tua licenza di 12 mesi. Controlla anche la posta indesiderata. Per assistenza: info@bandovera.it.'}</script></body></html>
